default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: postgres           # your PostgreSQL username
  password: <%= ENV['PG_PASSWORD'] %>   # password stored securely as environment variable
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: job_board

test:
  <<: *default
  database: job_board_test

production:
  <<: *default
  database: job_board_production
  username: your_production_db_user       # replace with your production DB username
  password: <%= ENV['DATABASE_PASSWORD'] %>   # production password from env variable
  host: localhost           # e.g., localhost or DB server IP
